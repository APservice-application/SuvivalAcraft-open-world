name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (core)
        run: npm run check

      - name: Typecheck (web)
        run: npx tsc -p web/tsconfig.json

      - name: Tests
        run: npm test

      - name: Smoke test (headless game boot)
        run: npm run test:smoke

      - name: Content validation
        run: npm run content:validate

      - name: Build (core + web)
        run: |
          npm run build
          npx vite build
